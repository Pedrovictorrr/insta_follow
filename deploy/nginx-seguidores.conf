# seguidores.cwsystems.com.br — "quem não me segue" (ig-lists/web). Estático + api.php (Pix Asaas).
# Fora do Forge. Certificado: certbot --webroot (renova sozinho pelo certbot.timer).

# só o "cobrar" é limitado (cada chamada cria cobrança no Asaas); o "status" é consultado a cada 4 s
map $arg_acao $seguidores_cobrar { cobrar $binary_remote_addr; default ""; }
limit_req_zone $seguidores_cobrar zone=seguidores_cobrar:1m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name seguidores.cwsystems.com.br;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    http2 on;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name seguidores.cwsystems.com.br;
    server_tokens off;
    root /home/forge/seguidores.cwsystems.com.br/public;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/seguidores.cwsystems.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seguidores.cwsystems.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/dhparams.pem;

    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;

    charset utf-8;
    client_max_body_size 8k;
    access_log off;
    error_log /var/log/nginx/seguidores.cwsystems.com.br-error.log error;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /api.php {
        limit_req zone=seguidores_cobrar burst=3 nodelay;
        limit_req_status 429;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/api.php;
    }

    # nenhum outro .php existe; não executa nada além do api.php
    location ~ \.php$ { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
